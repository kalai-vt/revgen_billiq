# Alembic config for the RevGenIQ Admin Portal's own database — a separate Postgres database
# from the Billing app's (see backend/alembic.ini for that one). Run from the database/
# directory: `alembic -c alembic_admin.ini upgrade head`.

[alembic]
script_location = %(here)s/alembic_admin
prepend_sys_path = ../backend
path_separator = os

sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
