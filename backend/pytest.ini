[pytest]
# Puts backend/ on sys.path so `from app import ...` resolves.
#
# Without this, only `python -m pytest` works — that form implicitly prepends the working
# directory, which is why the suite passes locally. CI runs bare `pytest -q`, which does not, so
# tests/conftest.py died on `No module named 'app'` before collecting a single test and the
# backend job had been reporting failure without ever running the suite.
pythonpath = .
testpaths = tests
