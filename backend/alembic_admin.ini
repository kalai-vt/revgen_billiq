# Alembic config for the RevGenIQ Admin Portal's database — a genuinely separate Postgres
# database from the tenant-facing app's (see app/core/admin_db.py for why). Deliberately its own
# ini/script-location/version-table so it can never be confused with or accidentally run against
# the tenant chain in backend/alembic.ini.

[alembic]
script_location = %(here)s/alembic_admin
version_table = alembic_version_admin
prepend_sys_path = .
path_separator = os

sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
