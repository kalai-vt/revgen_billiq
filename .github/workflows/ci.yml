name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest -q

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies for known vulnerabilities
        # PYSEC-2026-1325: known timing-attack weakness in the pure-Python `ecdsa` package, a
        # transitive dependency of python-jose (used for JWT signing/verification). No fixed
        # ecdsa release exists yet, and this app only signs JWTs with HS256 (see
        # core/config.py's jwt_algorithm) — the vulnerable ECDSA code path is never exercised.
        # Revisit if this app starts using EC-based JWT algorithms, or when ecdsa ships a fix.
        run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1325

  billing-app:
    name: billing-app (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: billing-app/package-lock.json

      - name: Install dependencies
        working-directory: billing-app
        run: npm ci

      - name: Build (tsc -b && vite build)
        working-directory: billing-app
        run: npm run build

  admin-portal:
    name: admin-portal (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin-portal/package-lock.json

      - name: Install dependencies
        working-directory: admin-portal
        run: npm ci

      - name: Build (tsc -b && vite build)
        working-directory: admin-portal
        run: npm run build
